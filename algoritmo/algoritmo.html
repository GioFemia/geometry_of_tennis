<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry of Tennis - Algoritmo</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* Override layout for 3-column design */
        .page-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.8em;
            height: 100vh;
            padding: 0.8em;
            box-sizing: border-box;
            margin: 0;
            min-width: 1500px;
        }

        /* Hide the controls sidebar */
        .controls-sidebar {
            display: none;
        }

        /* Hide mobile navigation and toggle buttons */
        .mobile-nav-bar,
        .mobile-panel-toggle,
        .page-footer-mobile {
            display: none !important;
        }

        /* Primary court (left) */
        .primary-court {
            grid-column: 1;
        }

        /* Secondary court (center) */
        .secondary-court {
            grid-column: 2;
            display: flex !important;
        }

        /* Algoritmo panel (right) */
        .algoritmo-panel {
            grid-column: 3;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(44, 62, 80, 0.13);
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .algoritmo-title {
            font-family: 'Poppins', 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #1976d2;
            margin: 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 16px;
            border-bottom: 3px solid #1976d2;
        }

        .algoritmo-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .algoritmo-section {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 16px;
        }

        .algoritmo-section-title {
            font-size: 16px;
            font-weight: 700;
            color: #263238;
            margin: 0 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .algoritmo-section-content {
            font-size: 14px;
            color: #546e7a;
            line-height: 1.6;
        }

        .calcola-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1976d2 0%, #42a5f5 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(25, 118, 210, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .calcola-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(25, 118, 210, 0.4);
        }

        .calcola-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(25, 118, 210, 0.3);
        }

        .algoritmo-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .field-label {
            font-weight: 600;
            color: #263238;
        }

        .field-value {
            font-weight: 700;
            font-size: 18px;
            color: #1976d2;
            font-family: 'Courier New', monospace;
        }

        /* Hide the arrow between courts */
        .courts-arrow {
            display: none !important;
        }

        /* Ensure court lock overlay is not shown */
        #courtLockOverlay {
            display: none !important;
        }

        /* Hide dinamico panel */
        #dinamicoPanel {
            display: none !important;
        }

        /* Ensure courts are properly sized */
        .court-container {
            min-width: 0;
        }

        .svg-wrap {
            min-width: 0;
        }

        .svg-wrap svg {
            min-width: 0;
        }
    </style>
</head>
<body>

                    <rect x="416" y="150" width="38" height="672" fill="#42a5f5" stroke="#fff" stroke-width="5"/>
                    <rect x="146" y="150" width="308" height="672" fill="none" stroke="#fff" stroke-width="5"/>
                    <line x1="300" y1="318" x2="300" y2="654" stroke="#fff" stroke-width="5"/>

                    <circle id="zone-circle-c" cx="329" cy="320" r="14" fill="#ffffff" stroke="#9c27b0" stroke-width="2" opacity="0.95" style="display: none;" />
                    <text id="zone-label-c" x="329" y="320" fill="#9c27b0" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" style="display: none;">C</text>
                    <circle id="zone-circle-d" cx="387" cy="320" r="14" fill="#ffffff" stroke="#9c27b0" stroke-width="2" opacity="0.95" style="display: none;" />

                    <!-- Zone del Campo per Campo A -->
                    <line id="zone-line-a-1" x1="242" y1="486" x2="242" y2="822" stroke="#9c27b0" stroke-width="2" opacity="0.7" style="display: none;" />
                    <line id="zone-line-a-2" x1="300" y1="486" x2="300" y2="822" stroke="#9c27b0" stroke-width="2" opacity="0.7" style="display: none;" />
                    <line id="zone-line-a-3" x1="358" y1="486" x2="358" y2="822" stroke="#9c27b0" stroke-width="2" opacity="0.7" style="display: none;" />
                    <circle id="zone-circle-a-field-a" cx="213" cy="654" r="14" fill="#ffffff" stroke="#9c27b0" stroke-width="2" opacity="0.95" style="display: none;" />

                    <circle id="zone-circle-c-field-a" cx="329" cy="654" r="14" fill="#ffffff" stroke="#9c27b0" stroke-width="2" opacity="0.95" style="display: none;" />

         <!-- Secondary Court (Center) -->

    <script>
        // Set initial configuration
        window.__modalita__ = '2colpi';
        window.__viewCoordinates__ = true;
        window.__viewDirections__ = true;
        window.__viewPlayer__ = true;
        window.__viewShot__ = true;
        window.__viewResponder__ = true;
        window.__viewCenter__ = true;
        window.__viewCover__ = false;
        window.__viewZones__ = false;
    </script>
    <script src="../app.js"></script>
    <script>
        // Force update after app.js has loaded
        window.addEventListener('load', function() {
            // Give app.js time to initialize
            setTimeout(function() {
                console.log('Forcing visualization update...');
                
                // Trigger change events to force visualization update
                const centerCheckbox = document.getElementById('view_center');
                const coordCheckbox = document.getElementById('view_coordinates');
                const bisectorLine = document.getElementById('bisectorLine');
                const tooltip = document.getElementById('coordinateTooltip');
                
                if (centerCheckbox) {
                    centerCheckbox.checked = true;
                    console.log('Centro checkbox checked:', centerCheckbox.checked);
                    centerCheckbox.dispatchEvent(new Event('change', { bubbles: true }));
                }
                
                if (coordCheckbox) {
                    coordCheckbox.checked = true;
                    console.log('Coordinate checkbox checked:', coordCheckbox.checked);
                    coordCheckbox.dispatchEvent(new Event('change', { bubbles: true }));
                }
                
                // Force bisector line to be visible
                if (bisectorLine) {
                    bisectorLine.style.display = '';
                    console.log('Bisector line display:', bisectorLine.style.display);
                }
                
                // Additional timeout to ensure everything is loaded
                setTimeout(function() {
                    // Trigger a click event to ensure all handlers are initialized
                    const svg = document.getElementById('tennisCourt');
                    if (svg) {
                        // Get svg bounding rect for proper coordinate calculation
                        const rect = svg.getBoundingClientRect();
                        const event = new MouseEvent('mousemove', {
                            bubbles: true,
                            cancelable: true,
                            view: window,
                            clientX: rect.left + rect.width / 2,
                            clientY: rect.top + rect.height / 2
                        });
                        svg.dispatchEvent(event);
                    }
                    console.log('Visualization update complete');
                }, 200);
            }, 150);
            
            // Setup Calcola button
            setTimeout(function() {
                const calcolaButton = document.getElementById('calcolaButton');
                const risultatiDiv = document.getElementById('risultatiAlgoritmo');
                const posizioneColpitoreSpan = document.getElementById('posizioneColpitore');
                const spazioColpoSpan = document.getElementById('spazioColpo');
                const spazioColpo2Span = document.getElementById('spazioColpo2');
                const spostamentoAvversarioSpan = document.getElementById('spostamentoAvversario');
                const distanzaMidPointSpan = document.getElementById('distanzaMidPoint');
                const campoDaCoprireSpan = document.getElementById('campoDaCoprire');
                
                if (calcolaButton) {
                    calcolaButton.addEventListener('click', function() {
                        console.log('Calcola button clicked');
                        
                        // Costanti del sistema di coordinate
                        const FIELD_B_ORIGIN_X = 300;
                        const FIELD_B_ORIGIN_Y = 150;
                        const FIELD_A_ORIGIN_X = 300;
                        const FIELD_A_ORIGIN_Y = 822;
                        const NET_Y = 486;
                        
                        // Funzioni di conversione coordinate
                        function svgToFieldB(svgX, svgY) {
                            return {
                                x: svgX - FIELD_B_ORIGIN_X,
                                y: svgY - FIELD_B_ORIGIN_Y
                            };
                        }
                        
                        function svgToFieldA(svgX, svgY) {
                            return {
                                x: svgX - FIELD_A_ORIGIN_X,
                                y: FIELD_A_ORIGIN_Y - svgY
                            };
                        }
                        
                        // Calcola Posizione Colpitore
                        // La Y del colpitore nel campo principale (in coordinate Campo A)
                        const cursorDot = document.getElementById('cursorDot');
                        let posizioneColpitore = 0;
                        
                        if (cursorDot) {
                            const dotY_svg = parseFloat(cursorDot.getAttribute('cy'));
                            // Converti in coordinate Campo A (Y positivo verso l'alto)
                            posizioneColpitore = FIELD_A_ORIGIN_Y - dotY_svg;
                            
                            console.log('=== Posizione Colpitore ===');
                            console.log('Colpitore Y (SVG):', dotY_svg);
                            console.log('Posizione Colpitore (Campo A):', posizioneColpitore);
                        }
                        
                        // Calcola Spazio Colpo e Spazio Colpo (Da Rete)
                        // Condizioni comuni: Campo B con Y > 0 e X compreso tra -115 e 115
                        // Spazio Colpo: Y da 0 a 250 (in Campo B)
                        // Spazio Colpo (Da Rete): Y da 0 a 336 (in Campo B, fino alla rete)
                        const yellowLine = document.getElementById('yellowLine');
                        let spazioColpo = 0;      // Da Rete (Y fino a 336)
                        let spazioColpo2 = 0;     // Standard (Y fino a 250)
                        
                        // Limiti X in coordinate Campo B
                        const X_MIN_FIELD_B = -115;
                        const X_MAX_FIELD_B = 115;
                        // Limiti X in coordinate SVG
                        const X_MIN_SVG = FIELD_B_ORIGIN_X + X_MIN_FIELD_B; // 300 - 115 = 185
                        const X_MAX_SVG = FIELD_B_ORIGIN_X + X_MAX_FIELD_B; // 300 + 115 = 415
                        
                        // Limiti Y in coordinate SVG
                        const Y_MIN_SVG = FIELD_B_ORIGIN_Y; // 150 (Y = 0 in Campo B)
                        const Y_MAX_SVG_RETE = NET_Y; // 486 (Y = 336 in Campo B, alla rete)
                        const Y_MAX_SVG_250 = FIELD_B_ORIGIN_Y + 250; // 400 (Y = 250 in Campo B)
                        
                        if (yellowLine) {
                            const x1_svg = parseFloat(yellowLine.getAttribute('x1'));
                            const y1_svg = parseFloat(yellowLine.getAttribute('y1'));
                            const x2_svg = parseFloat(yellowLine.getAttribute('x2'));
                            const y2_svg = parseFloat(yellowLine.getAttribute('y2'));
                            
                            console.log('=== Calcolo Spazio Colpo ===');
                            console.log('Yellow line SVG:', {x1: x1_svg, y1: y1_svg, x2: x2_svg, y2: y2_svg});
                            
                            // Usa l'algoritmo di Cohen-Sutherland per clipping della linea
                            function clipLine(x1, y1, x2, y2, xMin, xMax, yMin, yMax) {
                                const INSIDE = 0, LEFT = 1, RIGHT = 2, BOTTOM = 4, TOP = 8;
                                
                                function computeCode(x, y) {
                                    let code = INSIDE;
                                    if (x < xMin) code |= LEFT;
                                    else if (x > xMax) code |= RIGHT;
                                    if (y < yMin) code |= TOP;
                                    else if (y > yMax) code |= BOTTOM;
                                    return code;
                                }
                                
                                let code1 = computeCode(x1, y1);
                                let code2 = computeCode(x2, y2);
                                
                                while (true) {
                                    if (!(code1 | code2)) {
                                        return { x1, y1, x2, y2, valid: true };
                                    } else if (code1 & code2) {
                                        return { valid: false };
                                    } else {
                                        let x, y;
                                        const codeOut = code1 ? code1 : code2;
                                        
                                        if (codeOut & BOTTOM) {
                                            x = x1 + (x2 - x1) * (yMax - y1) / (y2 - y1);
                                            y = yMax;
                                        } else if (codeOut & TOP) {
                                            x = x1 + (x2 - x1) * (yMin - y1) / (y2 - y1);
                                            y = yMin;
                                        } else if (codeOut & RIGHT) {
                                            y = y1 + (y2 - y1) * (xMax - x1) / (x2 - x1);
                                            x = xMax;
                                        } else if (codeOut & LEFT) {
                                            y = y1 + (y2 - y1) * (xMin - x1) / (x2 - x1);
                                            x = xMin;
                                        }
                                        
                                        if (codeOut === code1) {
                                            x1 = x; y1 = y;
                                            code1 = computeCode(x1, y1);
                                        } else {
                                            x2 = x; y2 = y;
                                            code2 = computeCode(x2, y2);
                                        }
                                    }
                                }
                            }
                            
                            // Calcola Spazio Colpo (Da Rete) - Y da 0 a 336
                            const clippedRete = clipLine(x1_svg, y1_svg, x2_svg, y2_svg, X_MIN_SVG, X_MAX_SVG, Y_MIN_SVG, Y_MAX_SVG_RETE);
                            
                            if (clippedRete.valid) {
                                const start_fieldB = svgToFieldB(clippedRete.x1, clippedRete.y1);
                                const end_fieldB = svgToFieldB(clippedRete.x2, clippedRete.y2);
                                
                                console.log('--- Spazio Colpo (Da Rete) ---');
                                console.log('Linea clippata (SVG):', {x1: clippedRete.x1, y1: clippedRete.y1, x2: clippedRete.x2, y2: clippedRete.y2});
                                console.log('Start Campo B:', start_fieldB);
                                console.log('End Campo B:', end_fieldB);
                                
                                const dx = end_fieldB.x - start_fieldB.x;
                                const dy = end_fieldB.y - start_fieldB.y;
                                spazioColpo = Math.sqrt(dx * dx + dy * dy);
                                
                                console.log('Spazio Colpo (Da Rete):', spazioColpo);
                            } else {
                                console.log('Spazio Colpo (Da Rete): linea fuori dal rettangolo valido');
                            }
                            
                            // Calcola Spazio Colpo - Y da 0 a 250
                            const clipped250 = clipLine(x1_svg, y1_svg, x2_svg, y2_svg, X_MIN_SVG, X_MAX_SVG, Y_MIN_SVG, Y_MAX_SVG_250);
                            
                            if (clipped250.valid) {
                                const start_fieldB = svgToFieldB(clipped250.x1, clipped250.y1);
                                const end_fieldB = svgToFieldB(clipped250.x2, clipped250.y2);
                                
                                console.log('--- Spazio Colpo ---');
                                console.log('Linea clippata (SVG):', {x1: clipped250.x1, y1: clipped250.y1, x2: clipped250.x2, y2: clipped250.y2});
                                console.log('Start Campo B:', start_fieldB);
                                console.log('End Campo B:', end_fieldB);
                                
                                const dx = end_fieldB.x - start_fieldB.x;
                                const dy = end_fieldB.y - start_fieldB.y;
                                spazioColpo2 = Math.sqrt(dx * dx + dy * dy);
                                
                                console.log('Spazio Colpo:', spazioColpo2);
                            } else {
                                console.log('Spazio Colpo: linea fuori dal rettangolo valido');
                            }
                        }
                        
                        // Calcola Spostamento Avversario
                        // Distanza orizzontale nel Campo B del campo principale
                        // tra il ricevitore (intersectionDot) e la linea tratteggiata (bisectorLine)
                        // nel punto in cui la bisetrice ha la stessa Y del ricevitore
                        const intersectionDot = document.getElementById('intersectionDot');
                        const bisectorLine = document.getElementById('bisectorLine');
                        let spostamentoAvversario = 0;
                        
                        console.log('=== Calcolo Spostamento Avversario ===');
                        
                        if (intersectionDot && bisectorLine) {
                            // Coordinate SVG del ricevitore
                            const ricevitoreX_svg = parseFloat(intersectionDot.getAttribute('cx'));
                            const ricevitoreY_svg = parseFloat(intersectionDot.getAttribute('cy'));
                            
                            // Coordinate SVG della linea tratteggiata
                            const bisX1 = parseFloat(bisectorLine.getAttribute('x1'));
                            const bisY1 = parseFloat(bisectorLine.getAttribute('y1'));
                            const bisX2 = parseFloat(bisectorLine.getAttribute('x2'));
                            const bisY2 = parseFloat(bisectorLine.getAttribute('y2'));
                            
                            console.log('Ricevitore (SVG): x=' + ricevitoreX_svg + ', y=' + ricevitoreY_svg);
                            console.log('Linea tratteggiata (SVG): (' + bisX1 + ',' + bisY1 + ') -> (' + bisX2 + ',' + bisY2 + ')');
                            
                            // Calcola X della bisetrice alla stessa Y del ricevitore
                            let bisectorX_svg = bisX1;
                            if (Math.abs(bisY2 - bisY1) > 0.001) {
                                const t = (ricevitoreY_svg - bisY1) / (bisY2 - bisY1);
                                bisectorX_svg = bisX1 + t * (bisX2 - bisX1);
                            }
                            
                            console.log('X della bisetrice alla Y=' + ricevitoreY_svg + ': ' + bisectorX_svg);
                            
                            // Converti in coordinate Campo B
                            const ricevitoreX_fieldB = ricevitoreX_svg - FIELD_B_ORIGIN_X;
                            const bisX_fieldB = bisectorX_svg - FIELD_B_ORIGIN_X;
                            
                            console.log('Ricevitore (Campo B): X=' + ricevitoreX_fieldB);
                            console.log('Bisetrice (Campo B): X=' + bisX_fieldB);
                            
                            // Distanza orizzontale: differenza assoluta tra le X
                            spostamentoAvversario = Math.abs(ricevitoreX_fieldB - bisX_fieldB);
                            
                            console.log('Spostamento Avversario = |' + ricevitoreX_fieldB + ' - (' + bisX_fieldB + ')| = ' + spostamentoAvversario);
                        }
                        
                         // Calcola Distanza Mid Point
                        // Nel campo secondario, campo in basso (Campo A):
                        // - cursorDotReplica2 = pallino rosso nel Campo A (dove stava il colpitore originale)
                        // - bisectorLine2 = linea tratteggiata (centro)
                        // Calcola la distanza orizzontale tra il pallino e la bisetrice alla stessa Y
                        
                        const svg2 = document.querySelector('.svg-wrap.secondary svg');
                        let distanzaMidPoint = 0;
                        
                        console.log('=== Calcolo Distanza Mid Point ===');
                        
                        if (svg2) {
                            // Pallino rosso nel Campo A (in basso) del campo secondario
                            const dotReplica = svg2.querySelector('#cursorDotReplica2');
                            // Linea tratteggiata (bisetrice/centro)
                            const bisectorLine2 = svg2.querySelector('#bisectorLine2');
                            
                            console.log('cursorDotReplica2 trovato:', !!dotReplica);
                            console.log('bisectorLine2 trovato:', !!bisectorLine2);
                            
                            if (dotReplica && bisectorLine2) {
                                // Coordinate SVG del pallino rosso nel Campo A
                                const dotX_svg = parseFloat(dotReplica.getAttribute('cx'));
                                const dotY_svg = parseFloat(dotReplica.getAttribute('cy'));
                                
                                // Coordinate SVG della linea tratteggiata
                                const bisX1 = parseFloat(bisectorLine2.getAttribute('x1'));
                                const bisY1 = parseFloat(bisectorLine2.getAttribute('y1'));
                                const bisX2 = parseFloat(bisectorLine2.getAttribute('x2'));
                                const bisY2 = parseFloat(bisectorLine2.getAttribute('y2'));
                                
                                console.log('Pallino rosso (SVG): x=' + dotX_svg + ', y=' + dotY_svg);
                                console.log('Linea tratteggiata (SVG): (' + bisX1 + ',' + bisY1 + ') -> (' + bisX2 + ',' + bisY2 + ')');
                                
                                // Calcola X della bisetrice alla stessa Y del pallino
                                let bisectorX_svg = bisX1;
                                if (Math.abs(bisY2 - bisY1) > 0.001) {
                                    // Interpolazione lineare: trova X quando Y = dotY_svg
                                    const t = (dotY_svg - bisY1) / (bisY2 - bisY1);
                                    bisectorX_svg = bisX1 + t * (bisX2 - bisX1);
                                }
                                
                                console.log('X della bisetrice alla Y=' + dotY_svg + ': ' + bisectorX_svg);
                                
                                // Converti in coordinate Campo A
                                const dotX_fieldA = dotX_svg - FIELD_A_ORIGIN_X;
                                const dotY_fieldA = FIELD_A_ORIGIN_Y - dotY_svg;
                                const bisX_fieldA = bisectorX_svg - FIELD_A_ORIGIN_X;
                                
                                console.log('Pallino (Campo A): X=' + dotX_fieldA + ', Y=' + dotY_fieldA);
                                console.log('Bisetrice (Campo A): X=' + bisX_fieldA + ' (alla stessa Y)');
                                
                                // Distanza orizzontale: differenza assoluta tra le X
                                distanzaMidPoint = Math.abs(dotX_fieldA - bisX_fieldA);
                                
                                console.log('Distanza Mid Point = |' + dotX_fieldA + ' - (' + bisX_fieldA + ')| = ' + distanzaMidPoint);
                            }
                        }
                        
                        // Calcola Campo da Coprire
                        // Nel campo secondario, campo in basso (Campo A):
                        // Distanza orizzontale tra le due linee blu (leftLine2 e rightLine2)
                        // nel punto in cui hanno la stessa Y del colpitore (cursorDotReplica2)
                        let campoDaCoprire = 0;
                        
                        console.log('=== Calcolo Campo da Coprire ===');
                        
                        if (svg2) {
                            // Pallino rosso nel Campo A (colpitore nel campo in basso)
                            const dotReplica = svg2.querySelector('#cursorDotReplica2');
                            // Linee blu delle direzioni
                            const leftLine2 = svg2.querySelector('#leftLine2');
                            const rightLine2 = svg2.querySelector('#rightLine2');
                            
                            console.log('cursorDotReplica2 trovato:', !!dotReplica);
                            console.log('leftLine2 trovato:', !!leftLine2);
                            console.log('rightLine2 trovato:', !!rightLine2);
                            
                            if (dotReplica && leftLine2 && rightLine2) {
                                // Y del colpitore nel campo in basso
                                const dotY_svg = parseFloat(dotReplica.getAttribute('cy'));
                                
                                // Coordinate della linea sinistra
                                const leftX1 = parseFloat(leftLine2.getAttribute('x1'));
                                const leftY1 = parseFloat(leftLine2.getAttribute('y1'));
                                const leftX2 = parseFloat(leftLine2.getAttribute('x2'));
                                const leftY2 = parseFloat(leftLine2.getAttribute('y2'));
                                
                                // Coordinate della linea destra
                                const rightX1 = parseFloat(rightLine2.getAttribute('x1'));
                                const rightY1 = parseFloat(rightLine2.getAttribute('y1'));
                                const rightX2 = parseFloat(rightLine2.getAttribute('x2'));
                                const rightY2 = parseFloat(rightLine2.getAttribute('y2'));
                                
                                console.log('Y del colpitore (SVG):', dotY_svg);
                                console.log('Linea sinistra (SVG): (' + leftX1 + ',' + leftY1 + ') -> (' + leftX2 + ',' + leftY2 + ')');
                                console.log('Linea destra (SVG): (' + rightX1 + ',' + rightY1 + ') -> (' + rightX2 + ',' + rightY2 + ')');
                                
                                // Calcola X della linea sinistra alla Y del colpitore
                                let leftX_atDotY = leftX1;
                                if (Math.abs(leftY2 - leftY1) > 0.001) {
                                    const t = (dotY_svg - leftY1) / (leftY2 - leftY1);
                                    leftX_atDotY = leftX1 + t * (leftX2 - leftX1);
                                }
                                
                                // Calcola X della linea destra alla Y del colpitore
                                let rightX_atDotY = rightX1;
                                if (Math.abs(rightY2 - rightY1) > 0.001) {
                                    const t = (dotY_svg - rightY1) / (rightY2 - rightY1);
                                    rightX_atDotY = rightX1 + t * (rightX2 - rightX1);
                                }
                                
                                console.log('X linea sinistra alla Y=' + dotY_svg + ': ' + leftX_atDotY);
                                console.log('X linea destra alla Y=' + dotY_svg + ': ' + rightX_atDotY);
                                
                                // Converti in coordinate Campo A (solo X, la differenza è la stessa)
                                const leftX_fieldA = leftX_atDotY - FIELD_A_ORIGIN_X;
                                const rightX_fieldA = rightX_atDotY - FIELD_A_ORIGIN_X;
                                
                                console.log('X linea sinistra (Campo A):', leftX_fieldA);
                                console.log('X linea destra (Campo A):', rightX_fieldA);
                                
                                // Campo da coprire: distanza orizzontale tra le due linee
                                campoDaCoprire = Math.abs(rightX_fieldA - leftX_fieldA);
                                
                                console.log('Campo da Coprire = |' + rightX_fieldA + ' - (' + leftX_fieldA + ')| = ' + campoDaCoprire);
                            }
                        }
                        
                        // Mostra risultati (senza unità di misura, sono coordinate SVG)
                        if (posizioneColpitoreSpan) {
                            posizioneColpitoreSpan.textContent = posizioneColpitore.toFixed(2);
                        }
                        
                        if (spazioColpoSpan) {
                            spazioColpoSpan.textContent = spazioColpo.toFixed(2);
                        }
                        
                        if (spazioColpo2Span) {
                            spazioColpo2Span.textContent = spazioColpo2.toFixed(2);
                        }
                        
                        if (spostamentoAvversarioSpan) {
                            spostamentoAvversarioSpan.textContent = spostamentoAvversario.toFixed(2);
                        }
                        
                        if (distanzaMidPointSpan) {
                            distanzaMidPointSpan.textContent = distanzaMidPoint.toFixed(2);
                        }
                        
                        if (campoDaCoprireSpan) {
                            campoDaCoprireSpan.textContent = campoDaCoprire.toFixed(2);
                        }
                        
                        if (risultatiDiv) {
                            risultatiDiv.style.display = 'flex';
                        }
                     });
                 }
             }, 300);
             
             // Setup coordinate tooltip for secondary court
             setTimeout(function() {
                 const svg2 = document.querySelector('.svg-wrap.secondary svg');
                 const tooltip2 = document.getElementById('coordinateTooltip2');
                 const fieldBCoords2 = document.getElementById('fieldB-coords-2');
                 const fieldACoords2 = document.getElementById('fieldA-coords-2');
                 const tooltipFieldB2 = document.getElementById('tooltip-field-b-2');
                 const tooltipFieldA2 = document.getElementById('tooltip-field-a-2');
                 
                 if (svg2 && tooltip2) {
                     console.log('Setting up secondary court coordinates');
                     
                     // Costanti del sistema di coordinate
                     const FIELD_B_ORIGIN_X = 300;
                     const FIELD_B_ORIGIN_Y = 150;
                     const FIELD_A_ORIGIN_X = 300;
                     const FIELD_A_ORIGIN_Y = 822;
                     const NET_Y = 486;
                     
                     function svgToFieldB(svgX, svgY) {
                         return {
                             x: Math.round(svgX - FIELD_B_ORIGIN_X),
                             y: Math.round(svgY - FIELD_B_ORIGIN_Y)
                         };
                     }
                     
                     function svgToFieldA(svgX, svgY) {
                         return {
                             x: Math.round(svgX - FIELD_A_ORIGIN_X),
                             y: Math.round(FIELD_A_ORIGIN_Y - svgY)
                         };
                     }
                     
                     function getSVGCoordinates(evt) {
                         const pt = svg2.createSVGPoint();
                         pt.x = evt.clientX;
                         pt.y = evt.clientY;
                         const svgP = pt.matrixTransform(svg2.getScreenCTM().inverse());
                         return { x: svgP.x, y: svgP.y };
                     }
                     
                     svg2.addEventListener('mousemove', function(evt) {
                         if (!window.__viewCoordinates__) {
                             tooltip2.style.display = 'none';
                             return;
                         }
                         
                         const coords = getSVGCoordinates(evt);
                         const isAboveNet = coords.y < NET_Y;
                         
                         if (isAboveNet) {
                             // Campo B
                             const fieldB = svgToFieldB(coords.x, coords.y);
                             if (fieldBCoords2) {
                                 fieldBCoords2.textContent = `X: ${fieldB.x}, Y: ${fieldB.y}`;
                             }
                             if (tooltipFieldB2) tooltipFieldB2.style.display = 'flex';
                             if (tooltipFieldA2) tooltipFieldA2.style.display = 'none';
                         } else {
                             // Campo A
                             const fieldA = svgToFieldA(coords.x, coords.y);
                             if (fieldACoords2) {
                                 fieldACoords2.textContent = `X: ${fieldA.x}, Y: ${fieldA.y}`;
                             }
                             if (tooltipFieldB2) tooltipFieldB2.style.display = 'none';
                             if (tooltipFieldA2) tooltipFieldA2.style.display = 'flex';
                         }
                         
                         // Position tooltip
                         const tooltipRect = tooltip2.getBoundingClientRect();
                         const offset = 10;
                         let left = evt.clientX;
                         let top = evt.clientY - offset;
                         
                         if (left + tooltipRect.width > window.innerWidth) {
                             left = evt.clientX - tooltipRect.width - offset;
                         }
                         
                         if (top < 0) {
                             top = evt.clientY + offset;
                             tooltip2.style.transform = 'translate(-50%, 0)';
                         } else {
                             tooltip2.style.transform = 'translate(-50%, -100%)';
                         }
                         
                         tooltip2.style.left = left + 'px';
                         tooltip2.style.top = top + 'px';
                         tooltip2.style.display = 'block';
                     });
                     
                     svg2.addEventListener('mouseleave', function() {
                         tooltip2.style.display = 'none';
                     });
                     
                     console.log('Secondary court coordinates setup complete');
                 }
             }, 500);
         });
    </script>
