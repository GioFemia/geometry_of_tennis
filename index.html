<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry of Tennis</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="eraserIndicator" class="eraser-indicator"></div>
    <div class="page-container">
        <div class="controls-sidebar">
            <div class="settings-title" role="button" tabindex="0" aria-expanded="false">IMPOSTAZIONI</div>
            
            <!-- Modalità -->
            <div class="control-section collapsed">
                <h3 class="control-section-title">Modalità</h3>
                <div class="control-options">
                    <label class="control-option" for="modo_1colpo">
                        <input id="modo_1colpo" type="radio" name="modalita" value="1colpo" />
                        <span>1 Colpo</span>
                    </label>
                    <label class="control-option" for="modo_2colpi">
                        <input id="modo_2colpi" type="radio" name="modalita" value="2colpi" checked />
                        <span>2 Colpi</span>
                    </label>
                    <label class="control-option" for="modo_dinamico">
                        <input id="modo_dinamico" type="radio" name="modalita" value="dinamico" />
                        <span>Dinamico</span>
                    </label>
                </div>
            </div>
            
            <!-- Colpitore -->
            <div class="control-section collapsed">
                <h3 class="control-section-title">Colpitore</h3>
                <div class="control-options">
                    <label class="control-option" for="colpitore_tuo">
                        <input id="colpitore_tuo" type="radio" name="colpitore" value="tuo" checked />
                        <span>Tu</span>
                    </label>
                    <label class="control-option" for="colpitore_avv">
                        <input id="colpitore_avv" type="radio" name="colpitore" value="avversario" />
                        <span>Avversario</span>
                    </label>
                </div>
            </div>
            
            <!-- Tipologia di Colpo -->
            <div class="control-section collapsed">
                <h3 class="control-section-title">Tipologia</h3>
                <div class="control-options">
                    <label class="control-option" for="tipo_pal">
                        <input id="tipo_pal" type="radio" name="tipologia" value="palleggio" checked />
                        <span>Palleggio</span>
                    </label>
                    <label class="control-option" for="tipo_pas">
                        <input id="tipo_pas" type="radio" name="tipologia" value="passante" />
                        <span>Passante</span>
                    </label>
                    <label class="control-option" for="tipo_att">
                        <input id="tipo_att" type="radio" name="tipologia" value="attacco" />
                        <span>Attacco</span>
                    </label>
                    <label class="control-option" for="tipo_ser">
                        <input id="tipo_ser" type="radio" name="tipologia" value="servizio" />
                        <span>Servizio</span>
                    </label>
                </div>
            </div>
            
            <!-- Disegna -->
            <div class="control-section collapsed" id="draw-section">
                <h3 class="control-section-title">Disegna</h3>
                <div class="control-options">
                    <div class="draw-buttons-container">
                        <button id="draw_pen_btn" class="draw-tool-button" title="Matita">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z" />
                            </svg>
                        </button>
                        <button id="draw_arrow_btn" class="draw-tool-button" title="Freccia">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M4,12 L18,12 M18,12 L13,7 M18,12 L13,17" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        <button id="draw_line_btn" class="draw-tool-button" title="Linea">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4,20 L20,4"/>
                            </svg>
                        </button>
                        <button id="draw_text_btn" class="draw-tool-button" title="Testo">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M9.6,14L12,7.7L14.4,14M11,5L5.5,19H7.7L8.8,16H15.2L16.3,19H18.5L13,5H11Z"/>
                            </svg>
                        </button>
                        <button id="draw_ruler_btn" class="draw-tool-button" title="Righello">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M1.39,18.36L3.16,16.6L4.58,18L5.64,16.95L4.22,15.54L5.64,14.12L8.11,16.6L9.17,15.54L6.7,13.06L8.11,11.65L9.53,13.06L10.59,12L9.17,10.59L10.59,9.17L13.06,11.65L14.12,10.59L11.65,8.11L13.06,6.7L14.47,8.11L15.54,7.05L14.12,5.64L15.54,4.22L18,6.7L19.07,5.64L16.6,3.16L18.36,1.39L22.61,5.64L5.64,22.61L1.39,18.36Z"/>
                            </svg>
                        </button>
                        <button id="draw_eraser_btn" class="draw-tool-button" title="Gomma">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M16.24,3.56L21.19,8.5C21.97,9.29 21.97,10.55 21.19,11.34L12,20.53C10.44,22.09 7.91,22.09 6.34,20.53L2.81,17C2.03,16.21 2.03,14.95 2.81,14.16L13.41,3.56C14.2,2.78 15.46,2.78 16.24,3.56M4.22,15.58L7.76,19.11C8.54,19.9 9.8,19.9 10.59,19.11L14.12,15.58L9.17,10.63L4.22,15.58Z" />
                            </svg>
                        </button>
                        <button id="draw_clear_btn" class="draw-clear-button" title="Cancella tutto">
                            Cancella tutto
                        </button>
                    </div>
                    <div class="draw-color-picker">
                        <label class="draw-label">Colore:</label>
                        <input type="color" id="draw_color" value="#000000" />
                    </div>
                    <div class="draw-width-picker">
                        <label class="draw-label">Spessore:</label>
                        <input type="range" id="draw_width" min="1" max="10" value="3" />
                        <span id="draw_width_value">3</span>
                    </div>
                    <div class="draw-font-size-picker" id="draw_font_size_container" style="display: none;">
                        <label class="draw-label">Dimensione:</label>
                        <input type="range" id="draw_font_size" min="12" max="48" value="16" />
                        <span id="draw_font_size_value">16</span>
                    </div>
                </div>
            </div>
            
            <!-- Visualizza -->
            <div class="control-section collapsed">
                <h3 class="control-section-title">Visualizza</h3>
                <div class="control-options">
                    <label class="control-option" for="view_directions">
                        <input id="view_directions" type="checkbox" checked />
                        <span>Direzioni</span>
                    </label>
                    <label class="control-option" for="view_player">
                        <input id="view_player" type="checkbox" checked />
                        <span>Colpitore</span>
                    </label>
                    <label class="control-option" for="view_shot">
                        <input id="view_shot" type="checkbox" checked />
                        <span>Colpo</span>
                    </label>
                    <label class="control-option" for="view_responder">
                        <input id="view_responder" type="checkbox" checked />
                        <span>Ricevitore</span>
                    </label>
                    <label class="control-option" for="view_cover">
                        <input id="view_cover" type="checkbox" />
                        <span>Campo da Coprire</span>
                    </label>
                    <label class="control-option" for="view_center">
                        <input id="view_center" type="checkbox" checked />
                        <span>Centro</span>
                    </label>
                    <label class="control-option" for="view_coordinates">
                        <input id="view_coordinates" type="checkbox" />
                        <span>Coordinate</span>
                    </label>
                </div>
            </div>
            
            <!-- Superficie Campo -->
            <div class="control-section collapsed">
                <h3 class="control-section-title">Superficie</h3>
                <div class="control-options">
                    <label class="control-option" for="campo_cemento">
                        <input id="campo_cemento" type="radio" name="campoType" value="cemento" checked />
                        <span>Cemento</span>
                    </label>
                    <label class="control-option" for="campo_terra">
                        <input id="campo_terra" type="radio" name="campoType" value="terra" />
                        <span>Terra</span>
                    </label>
                    <label class="control-option" for="campo_erba">
                        <input id="campo_erba" type="radio" name="campoType" value="erba" />
                        <span>Erba</span>
                    </label>
                </div>
            </div>
            
            <!-- Default -->
            <div class="control-section collapsed">
                <h3 class="control-section-title">Default</h3>
                <div class="control-options">
                    <div class="default-subsection">
                        <label class="control-option" for="default_colpitore">
                            <span>Colpitore:</span>
                            <select id="default_colpitore" name="default_colpitore">
                                <option value="tuo" selected>Tu</option>
                                <option value="avversario">Avversario</option>
                            </select>
                        </label>
                    </div>
                    <div class="default-subsection">
                        <label class="control-option" for="default_modalita">
                            <span>Modalità:</span>
                            <select id="default_modalita" name="default_modalita">
                                <option value="1colpo">1 Colpo</option>
                                <option value="2colpi" selected>2 Colpi</option>
                                <option value="dinamico">Dinamico</option>
                            </select>
                        </label>
                    </div>
                    <div class="default-subsection">
                        <label class="control-option" for="default_tipologia">
                            <span>Tipologia:</span>
                            <select id="default_tipologia" name="default_tipologia">
                                <option value="palleggio" selected>Palleggio</option>
                                <option value="passante">Passante</option>
                                <option value="attacco">Attacco</option>
                                <option value="servizio">Servizio</option>
                            </select>
                        </label>
                    </div>
                    <div class="default-subsection">
                        <label class="control-option" for="default_campoType">
                            <span>Superficie:</span>
                            <select id="default_campoType" name="default_campoType">
                                <option value="cemento" selected>Cemento</option>
                                <option value="terra">Terra</option>
                                <option value="erba">Erba</option>
                            </select>
                        </label>
                    </div>
                    <div class="default-subsection">
                        <label class="control-option" for="default_view_directions">
                            <input id="default_view_directions" type="checkbox" checked />
                            <span>Visualizza: Direzioni</span>
                        </label>
                        <label class="control-option" for="default_view_player">
                            <input id="default_view_player" type="checkbox" checked />
                            <span>Visualizza: Colpitore</span>
                        </label>
                        <label class="control-option" for="default_view_shot">
                            <input id="default_view_shot" type="checkbox" checked />
                            <span>Visualizza: Colpo</span>
                        </label>
                        <label class="control-option" for="default_view_responder">
                            <input id="default_view_responder" type="checkbox" checked />
                            <span>Visualizza: Ricevitore</span>
                        </label>
                        <label class="control-option" for="default_view_cover">
                            <input id="default_view_cover" type="checkbox" />
                            <span>Visualizza: Campo da Coprire</span>
                        </label>
                        <label class="control-option" for="default_view_center">
                            <input id="default_view_center" type="checkbox" checked />
                            <span>Visualizza: Centro</span>
                        </label>
                        <label class="control-option" for="default_view_coordinates">
                            <input id="default_view_coordinates" type="checkbox" />
                            <span>Visualizza: Coordinate</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        
        <button id="mobilePanelToggle" class="mobile-panel-toggle" type="button" aria-label="Mostra campo secondario">
            <span class="mobile-panel-toggle-icon" aria-hidden="true"></span>
        </button>
        
        <div class="court-container primary-court">
            <div class="svg-wrap primary">
                <svg id="tennisCourt" width="100%" height="auto" viewBox="0 0 600 1006" style="background:#1565c0; border-radius:20px; display:block;">
                    <rect x="184" y="150" width="232" height="672" fill="#42a5f5" stroke="#fff" stroke-width="5"/>
                    <rect x="146" y="150" width="38" height="672" fill="#42a5f5" stroke="#fff" stroke-width="5"/>
                    <rect x="416" y="150" width="38" height="672" fill="#42a5f5" stroke="#fff" stroke-width="5"/>
                    <rect x="146" y="150" width="308" height="672" fill="none" stroke="#fff" stroke-width="5"/>
                    <line x1="300" y1="318" x2="300" y2="654" stroke="#fff" stroke-width="5"/>
                    <line x1="184" y1="318" x2="416" y2="318" stroke="#fff" stroke-width="5"/>
                    <line x1="184" y1="654" x2="416" y2="654" stroke="#fff" stroke-width="5"/>
                    <line x1="146" y1="150" x2="454" y2="150" stroke="#fff" stroke-width="5"/>
                    <line x1="146" y1="822" x2="454" y2="822" stroke="#fff" stroke-width="5"/>
                    <line x1="106" y1="486" x2="494" y2="486" stroke="#fff" stroke-width="10"/>
                    <!-- Coordinate system indicators -->
                    <!-- Campo B origin (300, 150) - top horizontal line center -->
                    <line x1="300" y1="150" x2="300" y2="160" stroke="#fff" stroke-width="5"/>
                    <!-- Campo A origin (300, 822) - bottom horizontal line center -->
                    <line x1="300" y1="822" x2="300" y2="812" stroke="#fff" stroke-width="5"/>
                    <polygon id="wedgeFill" points="300,822 185,0 415,0" fill="#000" fill-opacity="0.15" />
                    <line id="leftLine" x1="300" y1="822" x2="185" y2="0" stroke="#1976d2" stroke-width="3" stroke-linecap="round" />
                    <line id="rightLine" x1="300" y1="822" x2="415" y2="0" stroke="#1976d2" stroke-width="3" stroke-linecap="round" />
                    <line id="bisectorLine" x1="300" y1="822" x2="300" y2="0" stroke="#1976d2" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" />
                    <line id="yellowLine" x1="300" y1="822" x2="300" y2="0" stroke="#ffd600" stroke-width="4" stroke-linecap="round" opacity="0.9" style="cursor: ew-resize;" />
                    <line id="h-measure" x1="300" y1="100" x2="300" y2="100" stroke="#ff6f00" stroke-width="4" opacity="0.9" />
                    <rect id="h-measure-badge" x="280" y="89" width="40" height="22" fill="#fff" stroke="#ff6f00" stroke-width="1" rx="4" />
                    <text id="h-measure-label" x="300" y="100" fill="#ff6f00" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">0.0m</text>
                    <circle id="cursorDot" cx="300" cy="822" r="12" fill="#ff5252" stroke="#fff" stroke-width="2" />
                    <circle id="intersectionDot" cx="300" cy="100" r="8" fill="#ff5252" stroke="#fff" stroke-width="2" style="display: none; cursor: move;" />
                </svg>
                <div id="measureArrowHtml" class="arrow-container"><div class="arrow"></div></div>
                <div id="coordinateTooltip" class="coordinate-tooltip">
                    <div class="tooltip-content">
                        <div class="tooltip-field">
                            <span class="field-label">Campo B:</span>
                            <span id="fieldB-coords" class="field-coords">X: 0, Y: 0</span>
                        </div>
                        <div class="tooltip-field">
                            <span class="field-label">Campo A:</span>
                            <span id="fieldA-coords" class="field-coords">X: 0, Y: 0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="court-container secondary-court">
            <div class="svg-wrap secondary">
                <!-- Campo secondario generato in JS -->
            </div>
            <div id="courtLockOverlay" class="court-lock-overlay">
                <div class="lock-content">
                    <div class="lock-icon-wrapper">
                        <svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
                        </svg>
                    </div>
                    <div class="lock-message">
                        Per sbloccare il campo è necessario visualizzare:
                        <div class="lock-requirements">
                            <span>• COLPITORE</span>
                            <span>• COLPO</span>
                            <span>• RICEVITORE</span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="dinamicoPanel" class="dinamico-panel">
                <div class="control-field">
                    <label>NUMERO COLPO:</label>
                    <div class="numero-navigation">
                        <button id="prevColpoButton" class="nav-arrow" title="Colpo precedente">◀</button>
                        <div id="numeroColpo" class="numero-display">1</div>
                        <button id="nextColpoButton" class="nav-arrow" title="Colpo successivo">▶</button>
                    </div>
                </div>
                <div class="ultimo-colpo-field">
                    <label class="ultimo-colpo-label">
                        <input type="checkbox" id="ultimoColpoCheckbox" />
                        <span>ULTIMO COLPO</span>
                    </label>
                </div>
                <div class="dinamico-primary-row">
                    <button id="colpoButton" class="colpo-button">COLPO</button>
                    <button id="dinamicoMobileToggle" class="dinamico-mobile-toggle" type="button" aria-expanded="false" aria-label="Apri pannello Dinamico">
                        <span class="chevron" aria-hidden="true"></span>
                    </button>
                </div>
                <button id="visualizzaScambioButton" class="visualizza-scambio-button">VISUALIZZA PUNTO</button>
                <button id="pauseResumeButton" class="pause-resume-button" style="display: none;">
                    <span class="pause-icon">⏸️</span>
                </button>
                <button id="nuovoScambioButton" class="nuovo-scambio-button">NUOVO PUNTO</button>
            </div>
        </div>
    </div>

        <script src="app.js"></script>

</body>
</html>
